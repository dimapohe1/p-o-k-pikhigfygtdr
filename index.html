<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐱 Cat World</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    color: #333;
}

/* ===== HEADER ===== */
header {
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: url("https://images.unsplash.com/photo-1518791841217-8f162f1e1131") center/cover no-repeat;
    color: white;
    text-shadow: 2px 2px 10px rgba(0,0,0,0.6);
}

header h1 {
    font-size: 60px;
    animation: fadeIn 2s ease-in-out;
}

header p {
    font-size: 20px;
    margin-top: 15px;
}

/* ===== SECTION ===== */
section {
    padding: 80px 10%;
    text-align: center;
}

h2 {
    font-size: 36px;
    margin-bottom: 40px;
}

/* ===== CARDS ===== */
.cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 30px;
}

.card {
    background: white;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    transition: 0.4s;
}

.card:hover {
    transform: translateY(-10px);
}

.card img {
    width: 100%;
    height: 250px;
    object-fit: cover;
}

.card p {
    padding: 20px;
}

/* ===== VIDEO ===== */
.video-section {
    background: white;
}

video {
    width: 80%;
    max-width: 700px;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
}

/* ===== FOOTER ===== */
footer {
    background: #222;
    color: white;
    padding: 20px;
    text-align: center;
}

/* ===== ANIMATION ===== */
@keyframes fadeIn {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
}
</style>
</head>

<body>

<header>
    <h1>🐾 Мир Котиков</h1>
    <p>Самые милые создания на планете</p>
</header>

<section>
    <h2>Почему мы любим котиков?</h2>
    <div class="cards">
        <div class="card">
            <img src="https://cdn2.thecatapi.com/images/MTY3ODIyMQ.jpg">
            <p>Котики любят спать 16 часов в день 😴</p>
        </div>

        <div class="card">
            <img src="https://cdn2.thecatapi.com/images/MTY3ODIyMg.jpg">
            <p>Они очень игривые и смешные 🎾</p>
        </div>

        <div class="card">
            <img src="https://cdn2.thecatapi.com/images/MTY3ODIyMw.jpg">
            <p>И просто невероятно милые 🥰</p>
        </div>
    </div>
</section>

<section class="video-section">
    <h2>Видео с котиком 🎥</h2>
    <video controls>
        <source src="https://youtu.be/YbGsc1eHK1E">
        Ваш браузер не поддерживает видео.
    </video>
</section>

<footer>
    © 2026 Cat World | Сделано с любовью к котикам 🐱
</footer>

</body>
</html>
